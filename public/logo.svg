<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4D3B" />
      <stop offset="100%" stop-color="#143628" />
    </linearGradient>
    <linearGradient id="accentCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C53030" />
      <stop offset="100%" stop-color="#9B2C2C" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Japanese Diamond Mon -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#forestGrad)" filter="url(#subtleShadow)" />
  
  <!-- Outer hairline border -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

  <!-- Inner Diamond Emblem Structure -->
  <g transform="translate(256, 256)">
    <!-- Rotating diamond background -->
    <rect x="-140" y="-140" width="280" height="280" rx="36" transform="rotate(45)" fill="none" stroke="url(#goldAccent)" stroke-width="4" stroke-opacity="0.6" />
    
    <!-- Top-Right Red Accent Triangle symbolizing Rising Sun & Trade Compass -->
    <path d="M 0,-155 L 155,0 L 0,0 Z" fill="url(#accentCrimson)" opacity="0.95" />

    <!-- Stylized "K" & Japanese Cross-Trade Mon -->
    <!-- Vertical Pillar (Firm Foundation / Farming & Source) -->
    <path d="M -70,-115 L -35,-115 L -35,115 L -70,115 Z" fill="#FFFFFF" rx="4" />
    
    <!-- Upper Diagonal Wing (Global Logistics / Air & Sea Trade) -->
    <path d="M -25,-10 L 45,-115 L 95,-115 L 10,-10 Z" fill="#FFFFFF" />
    <polygon points="65,-115 95,-115 45,-45" fill="url(#goldAccent)" opacity="0.9" />

    <!-- Lower Diagonal Wing (Harvest / Distribution to Kitchen) -->
    <path d="M -25,10 L 10,10 L 95,115 L 45,115 Z" fill="#FFFFFF" />

    <!-- Center Seed / Pearl of Quality (Food Excellence) -->
    <circle cx="-35" cy="0" r="16" fill="url(#goldAccent)" stroke="#143628" stroke-width="3" />

    <!-- Orbit ring representing Global Supply Chain network -->
    <circle cx="0" cy="0" r="165" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />
  </g>
</svg>
